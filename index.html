<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGGIE STORE - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root, [data-theme="dark"] {
            --bg: #0c0f14;
            --surface: #141922;
            --surface-2: #1c2330;
            --ink: #f4f6fb;
            --muted: #9aa4b8;
            --accent: #10b981;
            --accent-ink: #04130d;
            --warm: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.09);
            --shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
        }

        [data-theme="light"] {
            --bg: #f6f4ef;
            --surface: #ffffff;
            --surface-2: #ece8df;
            --ink: #141820;
            --muted: #5b6475;
            --accent: #059669;
            --accent-ink: #ffffff;
            --warm: #d97706;
            --danger: #dc2626;
            --border: rgba(20, 24, 32, 0.11);
            --shadow: 0 12px 28px rgba(20, 24, 32, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Noto Sans', sans-serif;
        }

        .styled-name-text {
            font-family: 'Noto Sans', 'Plus Jakarta Sans', 'DejaVu Sans', 'Segoe UI Symbol', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif !important;
            text-transform: none !important;
            line-height: 1.45;
            font-variant-ligatures: none;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding-bottom: 50px;
            transition: background 0.25s ease, color 0.25s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 90;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 12px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title {
            font-family: 'Fraunces', serif;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .role-pill {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: color-mix(in srgb, var(--accent) 16%, transparent);
            color: var(--accent);
            padding: 3px 9px;
            border-radius: 7px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .btn {
            border: none;
            border-radius: 11px;
            padding: 9px 15px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-decoration: none;
            transition: transform 0.15s, opacity 0.2s;
        }

        .btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-primary { background: var(--accent); color: var(--accent-ink); }
        .btn-warm { background: var(--warm); color: #141820; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-ghost {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border);
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            max-width: 1120px;
            margin: 24px auto 0;
            padding: 0 20px;
        }

        .tabs-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .tabs-row::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--surface);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 9px 16px;
            border-radius: 12px;
            font-size: 0.83rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .panel-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 22px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
        }

        .panel-card h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.35rem;
            margin-bottom: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full { grid-column: 1 / -1; }

        label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--muted);
        }

        input[type="text"],
        input[type="number"],
        input[type="url"],
        select,
        textarea {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--ink);
            border-radius: 12px;
            padding: 10px 13px;
            font-size: 0.88rem;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        .paid-toggle-box {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--warm);
            cursor: pointer;
        }

        .items-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 15px;
        }

        .admin-item-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-thumb {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            object-fit: cover;
            background: var(--surface);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge-free {
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            color: var(--accent);
        }

        .badge-paid {
            background: color-mix(in srgb, var(--warm) 18%, transparent);
            color: var(--warm);
        }

        .badge-cat {
            background: var(--surface);
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .toast-msg {
            margin-top: 12px;
            font-size: 0.84rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-wrap">
            <span class="brand-title">MAGGIE ADMIN</span>
            <span class="role-pill">Direct Access</span>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn btn-ghost">
                <i class="fa-solid fa-store"></i> View Store
            </a>
            <button type="button" class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">
                <i id="themeIcon" class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <!-- DIRECT DASHBOARD (NO LOGIN SCREEN) -->
    <div id="dashboardScreen" class="wrap">
        <div class="tabs-row">
            <button type="button" class="tab-btn active" data-tab="appsTab" onclick="switchTab('appsTab')">
                <i class="fa-solid fa-mobile-screen"></i> Apps (Free / Paid)
            </button>
            <button type="button" class="tab-btn" data-tab="xmlTab" onclick="switchTab('xmlTab')">
                <i class="fa-solid fa-layer-group"></i> XML & Templates
            </button>
            <button type="button" class="tab-btn" data-tab="settingsTab" onclick="switchTab('settingsTab')">
                <i class="fa-solid fa-sliders"></i> Store & Socials
            </button>
        </div>

        <!-- TAB 1: APPS (SUPPORTS FREE & PAID) -->
        <div id="appsTab" class="tab-panel active">
            <div class="panel-card">
                <h2 id="appFormHeading"><i class="fa-solid fa-plus-circle"></i> Add New App</h2>
                <form id="appForm">
                    <input type="hidden" id="editAppId">
                    <div class="form-grid">
                        <div class="field">
                            <label for="appName">App Name *</label>
                            <input type="text" id="appName" class="styled-name-text" placeholder="e.g. Alight Motion Pro" required>
                        </div>
                        <div class="field">
                            <label for="appCategory">Category *</label>
                            <input type="text" id="appCategory" placeholder="e.g. Editing, Games, Tools" required>
                        </div>
                        <div class="field">
                            <label for="appLogoUrl">App Icon URL (imgbb / direct link) *</label>
                            <input type="url" id="appLogoUrl" placeholder="https://i.ibb.co/..." required>
                        </div>
                        <div class="field">
                            <label for="appDownloadUrl">Download / File URL (GitHub / Direct) *</label>
                            <input type="url" id="appDownloadUrl" placeholder="https://github.com/..." required>
                        </div>

                        <div class="field full">
                            <div class="paid-toggle-box">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="appIsPaid" onchange="toggleAppPriceInput()">
                                    <span>Paid App (Payment ke baad Download Link khulega; unchecked = Free App)</span>
                                </label>
                                <div id="appPriceWrap" style="display:none; align-items:center; gap:8px;">
                                    <label for="appPrice" style="margin:0;">Price (₹):</label>
                                    <input type="number" id="appPrice" min="1" value="29" style="width:110px;">
                                </div>
                            </div>
                        </div>

                        <div class="field full">
                            <label for="appDesc">Description</label>
                            <textarea id="appDesc" class="styled-name-text" placeholder="App details, version, features..."></textarea>
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
                        <button type="submit" id="saveAppBtn" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> Save App
                        </button>
                        <button type="button" id="cancelAppEditBtn" class="btn btn-ghost" style="display:none;" onclick="resetAppForm()">
                            Cancel Edit
                        </button>
                    </div>
                    <div id="appFormStatus" class="toast-msg"></div>
                </form>
            </div>

            <div class="panel-card">
                <h2>All Apps</h2>
                <div id="adminAppsList" class="items-list">
                    <p style="color:var(--muted);">Loading apps...</p>
                </div>
            </div>
        </div>

        <!-- TAB 2: XML & TEMPLATES -->
        <div id="xmlTab" class="tab-panel">
            <div class="panel-card">
                <h2 id="xmlFormHeading"><i class="fa-solid fa-plus-circle"></i> Add XML / Template</h2>
                <form id="xmlForm">
                    <input type="hidden" id="editXmlId">
                    <div class="form-grid">
                        <div class="field">
                            <label for="xmlTitle">Title *</label>
                            <input type="text" id="xmlTitle" class="styled-name-text" placeholder="e.g. 4K CC XML Pack" required>
                        </div>
                        <div class="field">
                            <label for="xmlType">Type *</label>
                            <select id="xmlType">
                                <option value="XML">XML</option>
                                <option value="Template">Template</option>
                                <option value="Preset">Preset</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="xmlThumbUrl">Thumbnail / Cover Photo URL</label>
                            <input type="url" id="xmlThumbUrl" placeholder="https://i.ibb.co/...">
                        </div>
                        <div class="field">
                            <label for="xmlProtectedLink">Protected Download / Drive / GitHub Link *</label>
                            <input type="url" id="xmlProtectedLink" placeholder="https://..." required>
                        </div>

                        <div class="field full">
                            <div class="paid-toggle-box">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="xmlIsPaid" checked onchange="toggleXmlPriceInput()">
                                    <span>Paid Item (Payment ke baad link unlock hoga)</span>
                                </label>
                                <div id="xmlPriceWrap" style="display:flex; align-items:center; gap:8px;">
                                    <label for="xmlPrice" style="margin:0;">Price (₹):</label>
                                    <input type="number" id="xmlPrice" min="1" value="9" style="width:110px;">
                                </div>
                            </div>
                        </div>

                        <div class="field full">
                            <label for="xmlPhotos">All Screenshots URLs (Ek line mein ek URL ya comma se alag karein)</label>
                            <textarea id="xmlPhotos" placeholder="https://i.ibb.co/shot1.jpg&#10;https://i.ibb.co/shot2.jpg"></textarea>
                        </div>

                        <div class="field full">
                            <label for="xmlDesc">Description</label>
                            <textarea id="xmlDesc" class="styled-name-text" placeholder="XML / Template details..."></textarea>
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
                        <button type="submit" id="saveXmlBtn" class="btn btn-warm">
                            <i class="fa-solid fa-floppy-disk"></i> Save XML / Template
                        </button>
                        <button type="button" id="cancelXmlEditBtn" class="btn btn-ghost" style="display:none;" onclick="resetXmlForm()">
                            Cancel Edit
                        </button>
                    </div>
                    <div id="xmlFormStatus" class="toast-msg"></div>
                </form>
            </div>

            <div class="panel-card">
                <h2>All XML & Templates</h2>
                <div id="adminXmlList" class="items-list">
                    <p style="color:var(--muted);">Loading XML & templates...</p>
                </div>
            </div>
        </div>

        <!-- TAB 3: STORE, GAME PROFILE & SOCIALS -->
        <div id="settingsTab" class="tab-panel">
            <div class="panel-card">
                <h2>Store General Settings</h2>
                <form id="settingsForm">
                    <div class="form-grid">
                        <div class="field">
                            <label for="storeNameInput">Store Name</label>
                            <input type="text" id="storeNameInput" class="styled-name-text" placeholder="MAGGIE STORE" required>
                        </div>
                        <div class="field">
                            <label for="storeLogoInput">Store Logo URL (imgbb)</label>
                            <input type="url" id="storeLogoInput" placeholder="https://i.ibb.co/...">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top:14px;">
                        <i class="fa-solid fa-check"></i> Save Store Settings
                    </button>
                    <div id="settingsStatus" class="toast-msg"></div>
                </form>
            </div>

            <!-- GAME UID & PROFILE PHOTOS (BOTTOM OF WEBSITE) -->
            <div class="panel-card">
                <h2><i class="fa-solid fa-gamepad"></i> Game UID & Profile Photos (Bottom Section)</h2>
                <form id="gameProfileForm">
                    <div class="form-grid">
                        <div class="field">
                            <label for="gameUidInput">Game UID (Khali chhodne par hide ho jayega)</label>
                            <input type="text" id="gameUidInput" class="styled-name-text" placeholder="e.g. 1234567890">
                        </div>
                        <div class="field">
                            <label for="gameLabelInput">Game Name / Styled Font (Optional)</label>
                            <input type="text" id="gameLabelInput" class="styled-name-text" placeholder="e.g. Mᴀ፝֟፝ɢɢɪᴇㅤᥫ᭡">
                        </div>
                        <div class="field full">
                            <label for="gameMainPhotoInput">Main Profile Photo URL (Hata doge toh sirf extra photos ya UID dikhega)</label>
                            <input type="url" id="gameMainPhotoInput" placeholder="https://i.ibb.co/main-profile.jpg">
                        </div>
                        <div class="field full">
                            <label for="gameExtraPhotosInput">Extra Profile Photos URLs (Main photo ke neeche — ek line mein ek URL ya comma se alag karein; hata doge toh kuch nahi dikhega)</label>
                            <textarea id="gameExtraPhotosInput" placeholder="https://i.ibb.co/extra1.jpg&#10;https://i.ibb.co/extra2.jpg"></textarea>
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> Save Game Profile
                        </button>
                        <button type="button" class="btn btn-danger" onclick="clearGameProfileData()">
                            <i class="fa-solid fa-trash"></i> Remove All Game Info
                        </button>
                    </div>
                    <div id="gameProfileStatus" class="toast-msg"></div>
                </form>
            </div>

            <div class="panel-card">
                <h2>Social Media Links</h2>
                <form id="socialForm">
                    <div class="form-grid">
                        <div class="field">
                            <label for="socialPlatform">Platform Name</label>
                            <input type="text" id="socialPlatform" class="styled-name-text" placeholder="Instagram / Telegram / YouTube / Discord" required>
                        </div>
                        <div class="field">
                            <label for="socialUrl">Profile / Channel URL</label>
                            <input type="url" id="socialUrl" placeholder="https://..." required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top:14px;">
                        <i class="fa-solid fa-plus"></i> Add Social Link
                    </button>
                    <div id="socialStatus" class="toast-msg"></div>
                </form>

                <div id="adminSocialsList" class="items-list" style="margin-top:18px;"></div>
            </div>
        </div>
    </div>

    <script>
        (function initTheme() {
            const t = localStorage.getItem("maggie_theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
            updateThemeIcon(t);
        })();

        function updateThemeIcon(theme) {
            const icon = document.getElementById("themeIcon");
            if (icon) {
                icon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
            }
        }

        window.toggleTheme = function () {
            const cur = document.documentElement.getAttribute("data-theme") || "dark";
            const next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("maggie_theme", next);
            updateThemeIcon(next);
        };

        window.switchTab = function (tabId) {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.getAttribute("data-tab") === tabId));
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === tabId));
        };

        window.toggleAppPriceInput = function () {
            const checked = document.getElementById("appIsPaid").checked;
            document.getElementById("appPriceWrap").style.display = checked ? "flex" : "none";
        };

        window.toggleXmlPriceInput = function () {
            const checked = document.getElementById("xmlIsPaid").checked;
            document.getElementById("xmlPriceWrap").style.display = checked ? "flex" : "none";
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz5VFvZ4nb7XOd8R72uW-aCYoLp0A_DAk",
            authDomain: "maggie-store-d3f3f.firebaseapp.com",
            projectId: "maggie-store-d3f3f",
            storageBucket: "maggie-store-d3f3f.firebasestorage.app",
            messagingSenderId: "646860878839",
            appId: "1:646860878839:web:1dd29cff6636c45bf374f2",
            measurementId: "G-BSTQZS5KQJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const FALLBACK_ICON = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4OCIgaGVpZ2h0PSI4OCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzFjMjMzMCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTglIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI2IiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZmlsbD0iIzlhYTRiOCI+TUFHR0lFPC90ZXh0Pjwvc3ZnPg==";

        let cachedApps = [];
        let cachedXmls = [];

        function cleanUrl(raw) {
            const val = (raw || "").trim();
            if (!val) return "";
            if (!val.startsWith("http://") && !val.startsWith("https://") && !val.startsWith("data:image/")) {
                return "https://" + val;
            }
            return val;
        }

        function setStatus(elId, msg, isError = false) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.style.color = isError ? "var(--danger)" : "var(--accent)";
            el.innerText = msg;
        }

        // APPS LIST
        onSnapshot(collection(db, "apps"), (snap) => {
            cachedApps = [];
            snap.forEach(d => cachedApps.push({ id: d.id, ...d.data() }));
            renderAdminApps();
        }, (err) => {
            setStatus("appFormStatus", err.message, true);
        });

        // XML & TEMPLATES LIST
        onSnapshot(collection(db, "xmlTemplates"), (snap) => {
            cachedXmls = [];
            snap.forEach(d => cachedXmls.push({ id: d.id, ...d.data() }));
            renderAdminXmls();
        }, (err) => {
            setStatus("xmlFormStatus", err.message, true);
        });

        // SETTINGS & GAME PROFILE
        onSnapshot(doc(db, "settings", "general"), (snap) => {
            if (snap.exists()) {
                const s = snap.data();
                if (s.storeName) document.getElementById("storeNameInput").value = s.storeName;
                if (s.logoUrl) document.getElementById("storeLogoInput").value = s.logoUrl;
                document.getElementById("gameUidInput").value = s.gameUid || "";
                document.getElementById("gameLabelInput").value = s.gameLabel || "";
                document.getElementById("gameMainPhotoInput").value = s.gameMainPhoto || "";
                document.getElementById("gameExtraPhotosInput").value = Array.isArray(s.gameExtraPhotos)
                    ? s.gameExtraPhotos.join("\n")
                    : "";
            }
        });

        // SOCIALS
        onSnapshot(collection(db, "socials"), (snap) => {
            const list = document.getElementById("adminSocialsList");
            list.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                const div = document.createElement("div");
                div.className = "admin-item-card";
                div.innerHTML = `
                    <div>
                        <div class="styled-name-text" style="font-weight:700;">${data.platform || "Link"}</div>
                        <div style="font-size:0.78rem; color:var(--muted); word-break:break-all;">${data.url || ""}</div>
                    </div>
                    <div class="item-actions">
                        <button type="button" class="btn btn-danger" onclick="deleteSocialDoc('${d.id}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
        });

        // APPS CRUD (FREE + PAID)
        window.resetAppForm = function () {
            document.getElementById("editAppId").value = "";
            document.getElementById("appForm").reset();
            document.getElementById("appIsPaid").checked = false;
            document.getElementById("appPrice").value = "29";
            toggleAppPriceInput();
            document.getElementById("appFormHeading").innerHTML = '<i class="fa-solid fa-plus-circle"></i> Add New App';
            document.getElementById("cancelAppEditBtn").style.display = "none";
            setStatus("appFormStatus", "");
        };

        window.startEditApp = function (id) {
            const item = cachedApps.find(a => a.id === id);
            if (!item) return;
            document.getElementById("editAppId").value = item.id;
            document.getElementById("appName").value = item.name || "";
            document.getElementById("appCategory").value = item.category || "";
            document.getElementById("appLogoUrl").value = item.logoUrl || "";
            document.getElementById("appDownloadUrl").value = item.downloadUrl || "";
            document.getElementById("appDesc").value = item.description || "";
            document.getElementById("appIsPaid").checked = Boolean(item.isPaid);
            document.getElementById("appPrice").value = item.price || 29;
            toggleAppPriceInput();

            document.getElementById("appFormHeading").innerHTML = '<i class="fa-solid fa-pen"></i> Edit App';
            document.getElementById("cancelAppEditBtn").style.display = "inline-flex";
            window.switchTab("appsTab");
            window.scrollTo({ top: 0, behavior: "smooth" });
        };

        window.quickToggleAppPaid = async function (id) {
            const item = cachedApps.find(a => a.id === id);
            if (!item) return;
            const nextPaid = !Boolean(item.isPaid);
            const nextPrice = nextPaid ? Math.max(1, Number(item.price || 29)) : 0;
            try {
                await updateDoc(doc(db, "apps", id), { isPaid: nextPaid, price: nextPrice });
                setStatus("appFormStatus", `${item.name || "App"} ab ${nextPaid ? `Paid (₹${nextPrice})` : "Free"} set ho gaya!`);
            } catch (err) {
                setStatus("appFormStatus", err.message, true);
            }
        };

        window.deleteAppDoc = async function (id) {
            if (!confirm("Is app ko delete karna hai?")) return;
            await deleteDoc(doc(db, "apps", id));
        };

        document.getElementById("appForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("editAppId").value.trim();
            const isPaid = document.getElementById("appIsPaid").checked;
            const price = isPaid ? Math.max(1, Number(document.getElementById("appPrice").value || 29)) : 0;

            const payload = {
                name: document.getElementById("appName").value.trim(),
                category: document.getElementById("appCategory").value.trim() || "General",
                logoUrl: cleanUrl(document.getElementById("appLogoUrl").value),
                downloadUrl: cleanUrl(document.getElementById("appDownloadUrl").value),
                description: document.getElementById("appDesc").value.trim(),
                isPaid,
                price
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "apps", editId), payload);
                    setStatus("appFormStatus", "App updated successfully!");
                } else {
                    await addDoc(collection(db, "apps"), payload);
                    setStatus("appFormStatus", "App added successfully!");
                }
                resetAppForm();
            } catch (err) {
                setStatus("appFormStatus", err.message, true);
            }
        });

        function renderAdminApps() {
            const container = document.getElementById("adminAppsList");
            container.innerHTML = "";
            if (cachedApps.length === 0) {
                container.innerHTML = '<p style="color:var(--muted);">Koi app nahi mila.</p>';
                return;
            }

            cachedApps.forEach(item => {
                const isPaid = Boolean(item.isPaid);
                const card = document.createElement("div");
                card.className = "admin-item-card";
                card.innerHTML = `
                    <div class="item-top">
                        <img src="${cleanUrl(item.logoUrl) || FALLBACK_ICON}" class="item-thumb" alt="Icon">
                        <div style="min-width:0; flex:1;">
                            <span class="badge badge-cat">${item.category || "General"}</span>
                            <span class="badge ${isPaid ? "badge-paid" : "badge-free"}">
                                ${isPaid ? `PAID • ₹${item.price || 29}` : "FREE"}
                            </span>
                            <div class="styled-name-text" style="font-weight:700; margin-top:3px;">${item.name || "App"}</div>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button type="button" class="btn ${isPaid ? "btn-primary" : "btn-warm"}" onclick="quickToggleAppPaid('${item.id}')">
                            <i class="fa-solid fa-repeat"></i> Make ${isPaid ? "Free" : "Paid"}
                        </button>
                        <button type="button" class="btn btn-ghost" onclick="startEditApp('${item.id}')">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button type="button" class="btn btn-danger" onclick="deleteAppDoc('${item.id}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // XML & TEMPLATES CRUD
        window.resetXmlForm = function () {
            document.getElementById("editXmlId").value = "";
            document.getElementById("xmlForm").reset();
            document.getElementById("xmlIsPaid").checked = true;
            document.getElementById("xmlPrice").value = "9";
            toggleXmlPriceInput();
            document.getElementById("xmlFormHeading").innerHTML = '<i class="fa-solid fa-plus-circle"></i> Add XML / Template';
            document.getElementById("cancelXmlEditBtn").style.display = "none";
            setStatus("xmlFormStatus", "");
        };

        window.startEditXml = function (id) {
            const item = cachedXmls.find(x => x.id === id);
            if (!item) return;
            document.getElementById("editXmlId").value = item.id;
            document.getElementById("xmlTitle").value = item.title || "";
            document.getElementById("xmlType").value = item.type || "XML";
            document.getElementById("xmlThumbUrl").value = item.thumbUrl || "";
            document.getElementById("xmlProtectedLink").value = item.protectedLink || "";
            document.getElementById("xmlPhotos").value = Array.isArray(item.photos) ? item.photos.join("\n") : "";
            document.getElementById("xmlDesc").value = item.description || "";
            document.getElementById("xmlIsPaid").checked = Boolean(item.isPaid);
            document.getElementById("xmlPrice").value = item.price || 9;
            toggleXmlPriceInput();

            document.getElementById("xmlFormHeading").innerHTML = '<i class="fa-solid fa-pen"></i> Edit XML / Template';
            document.getElementById("cancelXmlEditBtn").style.display = "inline-flex";
            window.switchTab("xmlTab");
            window.scrollTo({ top: 0, behavior: "smooth" });
        };

        window.deleteXmlDoc = async function (id) {
            if (!confirm("Is item ko delete karna hai?")) return;
            await deleteDoc(doc(db, "xmlTemplates", id));
        };

        document.getElementById("xmlForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("editXmlId").value.trim();
            const isPaid = document.getElementById("xmlIsPaid").checked;
            const price = isPaid ? Math.max(1, Number(document.getElementById("xmlPrice").value || 9)) : 0;

            const rawPhotos = document.getElementById("xmlPhotos").value
                .split(/[\n,]+/)
                .map(cleanUrl)
                .filter(Boolean);

            const thumb = cleanUrl(document.getElementById("xmlThumbUrl").value) || rawPhotos[0] || "";
            if (thumb && !rawPhotos.includes(thumb)) {
                rawPhotos.unshift(thumb);
            }

            const payload = {
                title: document.getElementById("xmlTitle").value.trim(),
                type: document.getElementById("xmlType").value,
                thumbUrl: thumb,
                photos: rawPhotos,
                protectedLink: cleanUrl(document.getElementById("xmlProtectedLink").value),
                description: document.getElementById("xmlDesc").value.trim(),
                isPaid,
                price
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "xmlTemplates", editId), payload);
                    setStatus("xmlFormStatus", "XML / Template updated!");
                } else {
                    await addDoc(collection(db, "xmlTemplates"), payload);
                    setStatus("xmlFormStatus", "XML / Template added!");
                }
                resetXmlForm();
            } catch (err) {
                setStatus("xmlFormStatus", err.message, true);
            }
        });

        function renderAdminXmls() {
            const container = document.getElementById("adminXmlList");
            container.innerHTML = "";
            if (cachedXmls.length === 0) {
                container.innerHTML = '<p style="color:var(--muted);">Koi XML / Template nahi mila.</p>';
                return;
            }

            cachedXmls.forEach(item => {
                const isPaid = Boolean(item.isPaid);
                const shotCount = Array.isArray(item.photos) ? item.photos.length : 0;
                const card = document.createElement("div");
                card.className = "admin-item-card";
                card.innerHTML = `
                    <div class="item-top">
                        <img src="${cleanUrl(item.thumbUrl) || FALLBACK_ICON}" class="item-thumb" alt="Thumb">
                        <div style="min-width:0; flex:1;">
                            <span class="badge badge-cat">${item.type || "XML"}</span>
                            <span class="badge ${isPaid ? "badge-paid" : "badge-free"}">
                                ${isPaid ? `PAID • ₹${item.price || 9}` : "FREE"}
                            </span>
                            <span class="badge badge-cat">${shotCount} Photos</span>
                            <div class="styled-name-text" style="font-weight:700; margin-top:3px;">${item.title || "Untitled"}</div>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button type="button" class="btn btn-ghost" onclick="startEditXml('${item.id}')">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button type="button" class="btn btn-danger" onclick="deleteXmlDoc('${item.id}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // SETTINGS, GAME PROFILE & SOCIALS
        document.getElementById("settingsForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                await setDoc(doc(db, "settings", "general"), {
                    storeName: document.getElementById("storeNameInput").value.trim() || "MAGGIE STORE",
                    logoUrl: cleanUrl(document.getElementById("storeLogoInput").value)
                }, { merge: true });
                setStatus("settingsStatus", "Store settings saved!");
            } catch (err) {
                setStatus("settingsStatus", err.message, true);
            }
        });

        document.getElementById("gameProfileForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const gameUid = document.getElementById("gameUidInput").value.trim();
            const gameLabel = document.getElementById("gameLabelInput").value.trim();
            const gameMainPhoto = cleanUrl(document.getElementById("gameMainPhotoInput").value);
            const gameExtraPhotos = document.getElementById("gameExtraPhotosInput").value
                .split(/[\n,]+/)
                .map(cleanUrl)
                .filter(Boolean);

            try {
                await setDoc(doc(db, "settings", "general"), {
                    gameUid,
                    gameLabel,
                    gameMainPhoto,
                    gameExtraPhotos
                }, { merge: true });
                setStatus("gameProfileStatus", "Game UID & profile photos saved!");
            } catch (err) {
                setStatus("gameProfileStatus", err.message, true);
            }
        });

        window.clearGameProfileData = async function () {
            if (!confirm("Game UID aur saari profile photos hata dein?")) return;
            try {
                await setDoc(doc(db, "settings", "general"), {
                    gameUid: "",
                    gameLabel: "",
                    gameMainPhoto: "",
                    gameExtraPhotos: []
                }, { merge: true });
                document.getElementById("gameUidInput").value = "";
                document.getElementById("gameLabelInput").value = "";
                document.getElementById("gameMainPhotoInput").value = "";
                document.getElementById("gameExtraPhotosInput").value = "";
                setStatus("gameProfileStatus", "Game UID & photos removed. Website par ab kuch nahi dikhega.");
            } catch (err) {
                setStatus("gameProfileStatus", err.message, true);
            }
        };

        document.getElementById("socialForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "socials"), {
                    platform: document.getElementById("socialPlatform").value.trim(),
                    url: cleanUrl(document.getElementById("socialUrl").value)
                });
                document.getElementById("socialForm").reset();
                setStatus("socialStatus", "Social link added!");
            } catch (err) {
                setStatus("socialStatus", err.message, true);
            }
        });

        window.deleteSocialDoc = async function (id) {
            await deleteDoc(doc(db, "socials", id));
        };
    </script>
</body>
</html>
